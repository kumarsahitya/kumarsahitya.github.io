<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var d = document.documentElement, t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try { t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'dark'; }
        }
        d.dataset.theme = t;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0513" media="(prefers-color-scheme: dark)" />
